<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIML Lab Datasets</title>
    <style>
        /* Base Strict Dark Theme */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #09090b;
            /* True deep dark background */
            color: #ededed;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        /* Main Container Card */
        .container {
            width: 100%;
            max-width: 850px;
            background: #18181b;
            /* Slightly lighter zinc for contrast */
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #27272a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Typography */
        h2 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        p.subtitle {
            color: #a1a1aa;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #27272a;
        }

        th {
            color: #71717a;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover {
            background-color: #27272a;
            /* Sleek row highlight on hover */
        }

        td strong {
            font-weight: 500;
            color: #e4e4e7;
            font-size: 15px;
        }

        /* Minimalist Buttons */
        button {
            background-color: transparent;
            color: #e4e4e7;
            border: 1px solid #3f3f46;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #fafafa;
            color: #09090b;
            border-color: #fafafa;
        }

        .copied,
        .copied:hover {
            background-color: #10b981 !important;
            color: #ffffff !important;
            border-color: #10b981 !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>AIML Lab Datasets</h2>
        <p class="subtitle">Secure, direct raw links for Google Colab integration.</p>

        <table>
            <thead>
                <tr>
                    <th>Filename</th>
                    <th style="width: 120px;">Action</th>
                </tr>
            </thead>
            <tbody id="dataset-list">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <script>
        const files = [
            "auto-mpg.csv",
            "BostonHousing.csv",
            "Cricket-Data-Analysis - edited.csv",
            "Cricket-Data-Analysis.csv",
            "Crop Recommendation dataset.csv",
            "diabetes.csv",
            "employees - edited.csv",
            "employees.csv",
            "fish.csv",
            "iris.csv",
            "Mall_Customers.csv",
            "marks.csv",
            "mtcars.csv",
            "penguins.csv",
            "placement.csv",
            "Position_Salaries.csv",
            "SEE created.csv",
            "student.csv",
            "tips.csv",
            "titanic.csv"
        ];

        const tbody = document.getElementById("dataset-list");

        files.forEach(file => {
            const fullUrl = new URL(file, window.location.href).href;
            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            const strong = document.createElement("strong");
            strong.textContent = file;
            nameCell.appendChild(strong);

            const actionCell = document.createElement("td");
            const btn = document.createElement("button");
            btn.textContent = "Copy Link";
            btn.onclick = () => copyLink(btn, fullUrl);
            actionCell.appendChild(btn);

            row.appendChild(nameCell);
            row.appendChild(actionCell);
            tbody.appendChild(row);
        });

        function copyLink(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerText;
                button.innerText = "Copied!";
                button.classList.add("copied");
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove("copied");
                }, 2000);
            });
        }
    </script>

</body>
</html>
